<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="shortcut icon" type="image/png" href="photo/logo_2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salomé Jollit</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff;
      color: #000;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #eee;
    }

    /* Lien "Salomé Jollit" */
    .brand {
      text-decoration: none;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      height: 28px;
      width: auto;
      display: block;
    }

    header nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: #000;
      font-weight: bold;
    }

    /* === Centrage du contenu === */
    main {
      max-width: 800px;     /* largeur max pour la lisibilité */
      margin: 60px auto;    /* espace autour + centrage horizontal */
      padding: 0 20px;      /* marges intérieures gauche/droite */
      text-align: center;   /* tout le texte centré */
      line-height: 1.6;     /* meilleure lisibilité */
    }

    main p {
      margin-bottom: 1rem;  /* espace entre paragraphes */
    }

    /* Responsive */
    @media (max-width: 700px) {
      main {
        margin: 30px auto;
        padding: 0 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <!-- Texte + logo cliquables ensemble -->
    <a href="index.html" class="brand">
      Salomé Jollit
      <img src="photo/logo.svg" alt="Logo">
    </a>

    <nav class="nav">
      <a href="index.html">Work</a>
      <a href="cv.html">About</a>
    </nav>
  </header>

  <main>
    <p>
      Hi, I'm a graphic design student looking for a 3-month internship in Europe from February 23 to May 18.
    </p>

    <p>If you are interested in my work, please contact me via email: 
      <strong><span style="color:#f5b1d0;">salomejollit@gmail.com</span></strong>
    </p>

    <p><strong>Website coded by myself :)</strong></p>
    <p>@ 2025 Salomé Jollit</p>
  </main>
</body>
</html>
